# Local development stack. The frontend joins this file as its Dockerfile
# lands; the database came first because the test suite runs against a real
# Postgres rather than mocks or SQLite.
#
# Values here are development-only and intentionally committed: the assessor
# clones fresh with no .env and runs `docker compose up --build`, so the stack
# must be self-sufficient. They are never used outside local/dev.


services:
  db:
    image: postgres:16-alpine
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobportal
      POSTGRES_PASSWORD: jobportal
      POSTGRES_DB: jobportal
    ports:
      # Exposed so the test suite and a locally-run uvicorn can reach it.
      # Once the backend is containerised it talks over the Docker network
      # instead, on the internal hostname `db`.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the separate test database on first boot. Read-only because
      # the container never needs to write back to the repo.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Gates dependent services: they wait for readiness, not merely for the
      # container to have started. Postgres briefly accepts then drops
      # connections during init, so "started" is not the same as "usable".
      test: ["CMD-SHELL", "pg_isready -U jobportal -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: jobportal-backend
    restart: unless-stopped
    environment:
      # Committed dev-only values. The assessor clones fresh with no .env and
      # runs `docker compose up --build`, and the app deliberately refuses to
      # boot without these — so compose has to supply them or nothing starts.
      # Each takes an override from the host environment, which is how a real
      # deployment injects its own without editing this file.
      #
      # This key is development-only and is NOT the one any developer has
      # locally. Rotate it for any deployment that is reachable by anyone else:
      # anyone holding it can forge a token for any user, including an HR role.
      SECRET_KEY: ${SECRET_KEY:-eWkxUgh3sU9zD4WzK3dHiDBF1F3ZaFTb9OWeGLcACoo}
      # Hostname `db`, not localhost: services reach each other over the compose
      # network, where the service name is the DNS name.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobportal:jobportal@db:5432/jobportal}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Health-gated rather than `depends_on: [db]`, which waits only for the
        # container to start. Postgres accepts and then drops connections during
        # init, so "started" would let migrations run against a database that is
        # about to hang up on them.
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, not container start. Relative by
        # default so the browser stays same-origin and nginx proxies /api to the
        # backend — no CORS preflight, and no API hostname baked into the
        # bundle that would only be correct on one machine.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: jobportal-frontend
    restart: unless-stopped
    ports:
      # 5173 on the host is the UI address the README quotes; 8080 inside is
      # what the unprivileged nginx image can bind as a non-root user.
      - "5173:8080"
    depends_on:
      backend:
        # nginx proxies to the backend, so starting before it is up would serve
        # 502s to anyone quick enough to load the page.
        condition: service_healthy

volumes:
  # Named rather than anonymous so data survives `docker compose down`.
  postgres_data:
