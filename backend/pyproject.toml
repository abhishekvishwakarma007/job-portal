[project]
name = "jobportal-backend"
version = "0.1.0"
description = "JobPortal API — FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed.py"]

[tool.coverage.report]
# Enforced in CI. Set at the level currently reached rather than an
# aspirational number, so it ratchets up and never silently drops.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Test helpers monkeypatch third-party internals where precise types add noise
# without adding safety.
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit — security lint
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test file; bandit's S101 is noise here. S105/S106
# likewise: the auth tests must name literal passwords to test passwords.
"tests/*" = ["S101", "S105", "S106"]
"tests_e2e/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
