# Serves the built SPA and proxies the API.
#
# Proxying rather than pointing the browser at localhost:8000 means the app is
# same-origin: no CORS preflight, no API host baked into the bundle, and the
# same relative URLs work whether the stack runs on a laptop or behind a real
# domain.

server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user, which
    # cannot bind a port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the document this server returns. The API sets
    # its own on its own origin (see backend/app/main.py) — these are not a
    # substitute for that, since :8000 is reachable directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # No inline scripts are emitted by the build, so script-src can stay tight.
    # 'unsafe-inline' remains for styles only, which Vite injects during
    # hydration of the critical CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend reads the rightmost entry to rate limit per caller.
        # $proxy_add_x_forwarded_for appends the peer this server actually
        # saw, so a client-supplied header cannot masquerade as it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The container's own liveness probe. Terminated here so it never depends
    # on the backend being up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: client-side routes like /jobs/<uuid> have no file on disk,
    # so anything unmatched serves index.html and lets the router decide. Never
    # placed before /api/, or API 404s would return HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
